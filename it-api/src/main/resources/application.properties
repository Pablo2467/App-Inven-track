spring.application.name=inven-track
server.port=${PORT:8080}

# --- PostgreSQL: usuario, clave y URL llegan por variables de entorno (nunca en el repositorio) ---
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/inven_track}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}


spring.jackson.time-zone=America/Bogota
spring.data.web.pageable.max-page-size=100
spring.data.web.pageable.default-page-size=20

# --- JWT (8 horas). JWT_SECRET es obligatoria y debe tener 32 o más caracteres ---
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=28800000

# --- CORS: lista exacta de orígenes del portal (sin comodines) ---
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:4200,http://127.0.0.1:4200}

# --- Reglas de negocio ---
app.lot.default-expiration-days=30
app.alerts.expiring-days=7

# --- JPA: el esquema lo crea it-db (scripts SQL), Hibernate NO lo modifica ---
spring.jpa.hibernate.ddl-auto=none

# --- Swagger / OpenAPI ---
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method